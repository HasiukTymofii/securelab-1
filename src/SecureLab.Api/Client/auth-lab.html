<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>ЛР 03 - сеанс</title>
</head>
<body>
<h1>Навчальний сеанс</h1>
<p>Стан: <strong id="state">перевіряємо…</strong></p>

<h2>Реєстрація</h2>
<form id="register">
  <label>Ім’я користувача <input name="userName" autocomplete="username" required maxlength="256"></label>
  <label>Email <input name="email" type="email" required maxlength="256"></label>
  <label>Відображуване ім’я <input name="displayName" required maxlength="120"></label>
  <label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
  <button>Зареєструватися</button>
</form>

<h2>Вхід</h2>
<form id="login">
  <label>Ім’я <input name="userName" autocomplete="username" required></label>
  <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
  <button>Увійти</button>
</form>
<p><button id="me" type="button">Мій профіль</button> <button id="logout" type="button">Вийти</button></p>

<h2>Профіль</h2>
<p id="profile-empty">Профілю немає.</p>
<dl id="profile" hidden>
  <dt>Id</dt><dd id="profile-id"></dd>
  <dt>Ім’я користувача</dt><dd id="profile-userName"></dd>
  <dt>Відображуване ім’я</dt><dd id="profile-displayName"></dd>
</dl>

<h2>Новий інцидент</h2>
<form id="incident">
  <label>Заголовок <input name="title" required maxlength="160"></label>
  <label>Опис <textarea name="description" required maxlength="4000"></textarea></label>
  <label>Severity
    <select name="severity">
      <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
    </select>
  </label>
  <label>Час події <input name="occurredAt" type="datetime-local" required></label>
  <button>Створити</button>
</form>

<pre id="result"></pre>
<script src="auth-lab.js" defer></script>
</body>
</html>
